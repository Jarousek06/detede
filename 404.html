<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stránka nenalezena · Detede</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f8f8;
      color: #09090b;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .brand { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #a1a1aa; margin-bottom: 2rem; }
    .code { font-size: clamp(4rem, 18vw, 9rem); font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
    .lead { margin-top: 1rem; color: #71717a; font-size: 1.05rem; }
    .home {
      display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 2.5rem;
      background: #09090b; color: #f8f8f8; padding: 0.9rem 1.75rem; border-radius: 9999px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      text-decoration: none; transition: background 0.3s ease;
    }
    .home:hover { background: #27272a; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Detede</div>
    <div class="code">404</div>
    <p class="lead">Tuhle stránku se nám nepodařilo najít.</p>
    <a class="home" href="/">← Zpět na hlavní stranu</a>
  </main>
</body>
</html>
